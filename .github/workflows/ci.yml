name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Reused by the deploy workflow so nothing ships without passing these gates.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (single source of truth).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -F @panelos/web lint
      - run: pnpm -F @panelos/web typecheck
      - run: pnpm -F @panelos/web test
      - run: pnpm -F @panelos/web build
        env:
          NEXT_PUBLIC_API_BASE: /api/v1
          API_INTERNAL_URL: http://localhost:8000

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-22.04
    env:
      APP_ENV: test
      # Integration tests start their own throwaway Postgres (testcontainers).
      # In CI a missing container must FAIL the run, not silently skip.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check apps/api/src apps/api/tests
      - run: uv run ruff format --check apps/api/src apps/api/tests
      - run: uv run mypy apps/api/src/panelos_api/core
      - name: Tests (connecting as table owner)
        run: uv run pytest apps/api/tests -q
      - name: Tests (row-level security enforced via app role)
        run: uv run pytest apps/api/tests -q
        env:
          DB_APP_ROLE: panelos_app

  openapi-drift:
    name: Generated files drift
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: uv sync --frozen --all-packages
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate schema + client
        run: pnpm codegen
      - name: Re-export the API image's locked requirements
        run: uv export --frozen --no-dev --no-emit-workspace --package panelos-api -o apps/api/requirements.lock -q
      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain packages/types apps/api/requirements.lock)" ]; then
            echo "::error::Generated files are out of date. Run 'pnpm codegen' and 'uv export --frozen --no-dev --no-emit-workspace --package panelos-api -o apps/api/requirements.lock', then commit."
            git diff --stat packages/types apps/api/requirements.lock
            exit 1
          fi

  docker-build-api:
    name: Docker build (api)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # Dockerfile COPYs are relative to apps/api — context must be apps/api.
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: panelos-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  ci-success:
    name: CI success
    runs-on: ubuntu-22.04
    needs: [web, api, openapi-drift, docker-build-api]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | python3 -c "import json,sys; d=json.load(sys.stdin); bad=[k for k,v in d.items() if v['result']!='success']; print('not successful:', bad); sys.exit(1 if bad else 0)"
