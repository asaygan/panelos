name: CD (api)

# Deployment target: Railway (https://railway.app).
# The API auto-deploys on push to `main` via Railway's GitHub integration
# (service root directory = apps/api, builds apps/api/Dockerfile). No CI deploy
# step is needed. This workflow only builds + publishes a versioned image to
# GHCR on `api-v*` tags so a pinned artifact exists for rollbacks.
# Database migrations are applied out-of-band (see docs/deployment/production.md).

on:
  push:
    tags:
      - "api-v*"
  workflow_dispatch:

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/panelos-api

jobs:
  build-and-push:
    name: Build & push api image (GHCR artifact)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#api-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          # Dockerfile COPYs are relative to apps/api — build context must be apps/api.
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
