version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: ["dependencies", "api"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: ["dependencies", "web"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["typescript", "eslint*", "prettier*", "vitest*", "@vitejs/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker", "api"]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker", "web"]
    commit-message:
      prefix: "chore(docker)"
