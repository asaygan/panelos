name: panelos_mobile
description: PanelOS field technician mobile app — QR scan, panel info, schematic viewer, offline cache.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.6.2

  # State
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Hardware / media
  mobile_scanner: ^5.2.3
  pdfx: ^2.8.0

  # UI / fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
