[project]
name = "panelos-api"
version = "0.1.0"
description = "PanelOS FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "passlib[argon2]>=1.7.4",
  "pyotp>=2.9",
  "segno>=1.6",
  "qrcode>=7.4",
  "Pillow>=10.4",
  "cairosvg>=2.7",
  "reportlab>=4.2",
  "svgwrite>=1.4",
  "boto3>=1.34",
  "redis>=5.0",
  "slowapi>=0.1.9",
  "nanoid>=2.0",
  "structlog>=24.1",
  "sentry-sdk>=2.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "email-validator>=2.2",
  "uuid7>=0.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "testcontainers[postgres]>=4.7",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panelos_api"]
