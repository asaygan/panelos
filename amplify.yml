# AWS Amplify Hosting build spec for the Next.js web app (monorepo).
#
# Configure in the Amplify console:
#   - App root:           apps/web
#   - Monorepo:           Yes (this file lives at the repo root)
#   - Build settings:     "Use a buildspec from your repository"
#
# Env vars to set in Amplify (no secrets in this file):
#   NEXT_PUBLIC_API_BASE        /api/v1
#   API_INTERNAL_URL            https://<app-runner-url>     # for the Next rewrite proxy
#   NEXT_PUBLIC_APP_URL         https://<amplify-domain>
#
# pnpm is installed via corepack; pnpm 9 matches the lockfile's compatRange.

version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9 --activate
            # Install workspace deps from the monorepo root, then build the web app.
            - cd ../..
            # CI-only: switch pnpm to hoisted node_modules. Amplify Hosting's
            # SSR runtime expects a flat node_modules tree with `next` directly
            # discoverable; the default pnpm symlink layout makes it appear
            # missing at deploy time and fails with "node_modules is missing
            # next dependency". Hoisted layout only applies inside the Amplify
            # build container — local dev (no NPM_CONFIG_NODE_LINKER) keeps
            # using the standard pnpm store with symlinks.
            #
            # --ignore-scripts skips native postinstall (pdfjs-dist → canvas),
            # whose Cairo + Pango libs aren't in the Amplify build image.
            - NPM_CONFIG_NODE_LINKER=hoisted pnpm install --frozen-lockfile --ignore-scripts
            - pnpm -F @panelos/types codegen || true
        build:
          commands:
            - pnpm -F @panelos/web build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
          - apps/web/.next/cache/**/*
